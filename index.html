<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Compliment Generator</title>

  <!-- Google Fonts: Nunito for compliments, Lato for UI -->
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="app-title">
      <h1 id="app-title" class="title">Compliment Generator</h1>
      <!-- friendly inline illustration (decorative) -->
      <div class="hero-illustration" aria-hidden="true">
        <svg width="160" height="80" viewBox="0 0 320 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
          <defs>
            <linearGradient id="g1" x1="0" x2="1">
              <stop offset="0" stop-color="#FFDEE9" />
              <stop offset="1" stop-color="#B5FFFC" />
            </linearGradient>
          </defs>
          <rect x="0" y="20" width="320" height="120" rx="20" fill="url(#g1)" opacity="0.14" />
          <g transform="translate(24,28)">
            <circle cx="40" cy="36" r="28" fill="#FFD166" opacity="0.95" />
            <path d="M84 66c-6-14-26-20-40-10" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
            <g transform="translate(120,18)">
              <rect x="0" y="0" width="44" height="44" rx="8" fill="#FF6B6B" opacity="0.95" />
              <circle cx="22" cy="22" r="8" fill="#FFF" opacity="0.9" />
            </g>
          </g>
        </svg>
      </div>

      <!-- emoji badge that updates with each compliment -->
      <div id="emoji-badge" class="emoji-badge" aria-hidden="true">✨</div>

      <!-- Compliment display area (readonly textarea for accessibility and copyable text) -->
      <textarea id="compliment" class="compliment" rows="4" readonly aria-live="polite" aria-label="Compliment display"></textarea>

      <!-- Button to get a new compliment -->
      <button id="new-btn" class="btn" type="button" aria-label="Get a new compliment">Get a New Compliment</button>

      <p class="hint">A warm word for your day — click to refresh.</p>
      <!-- decorative micro-shapes for visual intrigue -->
      <div class="decor" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </section>
  </main>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
