<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Compliment Generator">
  <defs>
    <linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#FFDEE9" />
      <stop offset="50%" stop-color="#FF6B6B" />
      <stop offset="100%" stop-color="#B5FFFC" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- rounded background card -->
  <rect x="0" y="0" width="64" height="64" rx="12" fill="url(#bgGrad)" />

  <!-- subtle glossy highlight -->
  <ellipse cx="34" cy="14" rx="20" ry="8" fill="url(#glow)" />

  <!-- stylized heart / card symbol -->
  <g transform="translate(12,12) scale(1.6)" filter="url(#softShadow)">
    <path d="M8 2c2.2 0 4 1.6 4 3.6 0 3.2-4 5.6-4 5.6s-4-2.4-4-5.6C4 3.6 5.8 2 8 2z" fill="#FFF" />
    <rect x="10" y="8" width="14" height="10" rx="2" fill="#FFF" opacity="0.08" />
  </g>

  <!-- decorative sparkles -->
  <g transform="translate(46,10)" fill="#FFF" opacity="0.95">
    <path d="M0 2.5 L1.6 3.1 L2.5 4.7 L3.4 3.1 L5 2.5 L3.4 1.9 L2.5 0.3 L1.6 1.9 Z" transform="scale(2) translate(-1,-1)" />
  </g>
  <g transform="translate(50,38)" fill="#FFF" opacity="0.75">
    <path d="M2 0 L2.8 1.2 L4 2 L2.8 2.8 L2 4 L1.2 2.8 L0 2 L1.2 1.2 Z" transform="scale(1.4) translate(-1,-1)" />
  </g>

  <!-- tiny border for crisp edges on light backgrounds -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="11.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" />
</svg>
